<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>preview/spacing-shadow.html</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 88px 88px;
  }
  .card { padding: 28px 32px; min-height: 224px; box-sizing: border-box; position: relative; z-index: 1; }
  .swatch {
    height: 64px; border-radius: 2px;
    border: 1px solid var(--border-hairline);
    display: flex; align-items: flex-end; padding: 8px 10px;
    color: var(--fg);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.10em;
    text-transform: uppercase;
  }
  .swatch.dark { color: var(--fg); }
  .swatch.light { color: var(--abyss); }
  .label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-top: 8px; }
  .name  { font-family: var(--font-sans); font-size: 13px; color: var(--fg); font-weight: 500; margin-top: 8px; letter-spacing: -0.005em; }
  .meta  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); letter-spacing: 0.08em; text-transform: uppercase; }
  .meta-low  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
  hr.hair { border: 0; border-top: 1px solid var(--border-hairline); margin: 14px 0; }
  .eyebrow-num {
    color: var(--signal); font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    border: 1px solid var(--border-signal); padding: 2px 8px; border-radius: 2px;
    background: var(--signal-soft);
  }
</style>
</head>
<body>
<div class="card">
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;">
    
      <div>
        <div style="height: 96px; background: var(--night-elev-1); border-radius: 4px; box-shadow: var(--shadow-1); border: 1px solid var(--border-hairline);"></div>
        <div class="name">shadow-1</div>
        <div class="meta-low">Quiet lift</div>
      </div>
    
      <div>
        <div style="height: 96px; background: var(--night-elev-1); border-radius: 4px; box-shadow: var(--shadow-2); border: 1px solid var(--border-hairline);"></div>
        <div class="name">shadow-2</div>
        <div class="meta-low">Card hover</div>
      </div>
    
      <div>
        <div style="height: 96px; background: var(--night-elev-1); border-radius: 4px; box-shadow: var(--shadow-3); border: 1px solid var(--border-hairline);"></div>
        <div class="name">shadow-3</div>
        <div class="meta-low">Modal</div>
      </div>
    
      <div>
        <div style="height: 96px; background: var(--night-elev-1); border-radius: 4px; box-shadow: var(--shadow-4); border: 1px solid var(--border-hairline);"></div>
        <div class="name">shadow-4</div>
        <div class="meta-low">Overlay</div>
      </div>
    
  </div>
  <div class="meta" style="margin-top: 16px;">// Shadows drop into the deep · accent elements glow instead (signal halo)</div>
</div>
</body>
</html>
