<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lake Project</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0f1e;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #4a6fa5;
      margin: 1.5rem auto;
    }

    p {
      font-size: 1rem;
      color: #8a9bb5;
      letter-spacing: 0.05em;
    }

    .coming-soon {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #4a6fa5;
      border: 1px solid #1e3a5f;
      padding: 0.5rem 1.5rem;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lake Project</h1>
    <div class="divider"></div>
    <p>Rotterdam &mdash; KvK 29816688</p>
    <span class="coming-soon">Coming Soon</span>
  </div>
</body>
</html>
