<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>preview/spacing-scale.html</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 88px 88px;
  }
  .card { padding: 28px 32px; min-height: 244px; box-sizing: border-box; position: relative; z-index: 1; }
  .swatch {
    height: 64px; border-radius: 2px;
    border: 1px solid var(--border-hairline);
    display: flex; align-items: flex-end; padding: 8px 10px;
    color: var(--fg);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.10em;
    text-transform: uppercase;
  }
  .swatch.dark { color: var(--fg); }
  .swatch.light { color: var(--abyss); }
  .label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-top: 8px; }
  .name  { font-family: var(--font-sans); font-size: 13px; color: var(--fg); font-weight: 500; margin-top: 8px; letter-spacing: -0.005em; }
  .meta  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); letter-spacing: 0.08em; text-transform: uppercase; }
  .meta-low  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
  hr.hair { border: 0; border-top: 1px solid var(--border-hairline); margin: 14px 0; }
  .eyebrow-num {
    color: var(--signal); font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    border: 1px solid var(--border-signal); padding: 2px 8px; border-radius: 2px;
    background: var(--signal-soft);
  }
</style>
</head>
<body>
<div class="card">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-1</div>
        <div style="height: 8px; background: var(--signal); width: 2px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">2px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-2</div>
        <div style="height: 8px; background: var(--signal); width: 4px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">4px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-3</div>
        <div style="height: 8px; background: var(--signal); width: 8px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">8px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-4</div>
        <div style="height: 8px; background: var(--signal); width: 12px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">12px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-5</div>
        <div style="height: 8px; background: var(--signal); width: 16px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">16px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-6</div>
        <div style="height: 8px; background: var(--signal); width: 20px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">20px</div>

      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">

      </div>

        <div class="meta-low">32px</div>
      </div>

        <div class="meta" style="text-align: right;">--space-9</div>
        <div style="height: 8px; background: var(--signal); width: 40px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">40px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-10</div>
        <div style="height: 8px; background: var(--signal); width: 48px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">48px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-11</div>
        <div style="height: 8px; background: var(--signal); width: 64px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>
        <div class="meta-low">64px</div>
      </div>
    
      <div style="display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 12px;">
        <div class="meta" style="text-align: right;">--space-12</div>
        <div style="height: 8px; background: var(--signal); width: 80px; border-radius: 1px; box-shadow: 0 0 6px var(--signal-glow);"></div>

      </div>
    
  </div>
</div>
</body>
</html>
